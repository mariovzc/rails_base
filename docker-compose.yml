version: "3.9"

services:
  web:
    build: .
    command: bin/rails server -b 0.0.0.0 -p 3000
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development
      - NODE_ENV=development
    stdin_open: true
    tty: true

volumes:
  bundle_data:
